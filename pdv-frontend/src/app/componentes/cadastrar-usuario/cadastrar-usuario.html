<div class="cadastro-container">
  <div class="cadastro-box">
    <p style="font-size: 20px; margin-bottom: 15px;"><b>Cadastro</b></p>
    <form [formGroup]="cadastroForm" (ngSubmit)="cadastrar()">

     
      <div class="form-group">
        <label for="nome"><b>Nome</b></label>
        <input id="nome" type="text" formControlName="nome" />
        
        <div class="error" *ngIf="(cadastroForm.get('nome')?.touched || submitted) && cadastroForm.get('nome')?.invalid">
          <small *ngIf="cadastroForm.get('nome')?.errors?.['required']">Usuário é obrigatório</small>
          
        </div>
      </div>

      <div class="form-group">
        <label for="papel"><b>Papel</b></label>
        <select formControlName="papel" class="form-control">
  <option *ngFor="let papel of papeis" [value]="papel.value">
    {{ papel.label }}
  </option>
</select>
        
        <div class="error" *ngIf="(cadastroForm.get('papel')?.touched || submitted) && cadastroForm.get('papel')?.invalid">
          <small *ngIf="cadastroForm.get('papel')?.errors?.['required']">Papel é obrigatório</small>
          
        </div>
      </div>

      <div class="form-group">
        <label for="senha"><b>Senha</b></label>
        <input id="senha" type="password" formControlName="senha" />
        
        <div class="error" *ngIf="(cadastroForm.get('senha')?.touched || submitted) && cadastroForm.get('senha')?.invalid">
          <small *ngIf="cadastroForm.get('senha')?.errors?.['required']">Senha é obrigatória</small>
          
        </div><p *ngIf="erroCadastro" class="erro-cadastro">Credenciais inválidas</p>
      </div>

      <button type="submit" class="cadastro-btn">Cadastrar</button>
    </form>
  </div>
</div>
