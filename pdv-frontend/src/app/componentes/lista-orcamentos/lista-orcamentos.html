<div class="lista-orcamento-container">


  <h2 class="titulo" *ngIf="!emEdicao">Lista de Orçamentos</h2>
  <table class="tabela-produtos" *ngIf="!emEdicao">
    <thead>
      <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Validade</th>
        <th>Itens</th>
        <th>Total</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let o of orcamentos">
        <td data-label="ID">{{ o.id }}</td>
        <td data-label="Cliente">{{ o.cliente?.nome || 'Cliente não identificado'}}</td>
        <td data-label="Validade">{{ o.validade | date:'dd/MM/yyyy'}}</td>
        <td data-label="Itens">{{ o.itens }}</td>
        <td data-label="Total">R$ {{ o.total | number:'1.2-2'}}</td>
        <td data-label="Status">{{ o.status }}</td>
        <td data-label="Ações">
          <button class="btn btn-edit" (click)="editarOrcamento(o)">✏️ Editar</button>
        </td>
      </tr>

    </tbody>
  </table>

 
  

  <div *ngIf="orcamentoSelecionado" class="form-container">
    <h2 class="titulo">
      Editar Orçamento
    </h2>

    <form [formGroup]="formEdicao" (ngSubmit)="salvarOrcamento()" class="form-orcamento">
      <div class="form-group">
        <label>Nome:</label>
        <input type="text" formControlName="nome">
      </div>

      <div class="form-group">
        <label>Marca:</label>
        <input type="text" formControlName="marca">
      </div>

      <div class="form-group">
        <label>Modelo:</label>
        <input type="text" formControlName="modelo">
      </div>

      <div class="form-group">
        <label>Quantidade:</label>
        <input type="number" formControlName="quantidade">
      </div>

      <div class="form-group">
        <label>Valor Custo:</label>
        <input type="number" formControlName="valorCusto">
      </div>

      <div class="form-group">
        <label>Valor Venda:</label>
        <input type="number" formControlName="valorVenda">
      </div>

      <div class="form-group">
        <label>Imagem (URL):</label>
        <input type="text" formControlName="imageUrl">
      </div>

      <div class="form-group">
        <label>Validade:</label>
        <input type="date" formControlName="validade">
      </div>

      <!-- Dimensões -->
      <fieldset formGroupName="dimensoes" class="dimensoes">
        <legend>Dimensões</legend>
        <div class="form-group">
          <label>Largura:</label>
          <input type="number" formControlName="largura">
        </div>
        <div class="form-group">
          <label>Altura:</label>
          <input type="number" formControlName="altura">
        </div>
        <div class="form-group">
          <label>Profundidade:</label>
          <input type="number" formControlName="profundidade">
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Atualizar</button>
        <button type="button" class="btn btn-cancel" (click)="cancelarEdicao()">Cancelar</button>
      </div>
    </form>

    
  </div>
<div>

 <button class="btn btn-primary"
          type="button"
          
          (click)="primeiraPagina()"
          [disabled]="pagina === 0">
    <<
  </button>

  <button class="btn btn-primary"
          type="button"
          
          (click)="paginaAnterior()"
          [disabled]="pagina === 0">
    <
  </button>

   @for (p of paginas; track p) {
    <button [class.active]="pagina === p"
             class="btn btn-primary"
            (click)="irParaPagina(p)">
      {{ p + 1 }}
    </button>
  }

  <button class="btn btn-primary"
          type="button"
         
          (click)="proximaPagina()"
          [disabled]="isLastPage">
    >
  </button>

  

  <button class="btn btn-primary"
          type="button"
         
          (click)="ultimaPagina()"
          [disabled]="isLastPage">
    >>
  </button>
</div>

</div>
